<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04090F" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F6FA" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swimmable">
  <meta name="description" content="Go, Sketchy or No — an honest read on the sea for swimming and freediving.">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <title>Swimmable</title>
</head>
<body>
  <div id="app">
    <!-- Main tab content -->
    <main id="tabs-content">

      <!-- Tab 1: Conditions -->
      <section id="tab-conditions" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-conditions">

        <header class="conditions-header">
          <button class="location-chip" id="location-chip" aria-label="Change location">
            <svg class="location-pin-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 1C4.79 1 3 2.79 3 5c0 3.25 4 8 4 8s4-4.75 4-8c0-2.21-1.79-4-4-4z" fill="currentColor"/>
              <circle cx="7" cy="5" r="1.5" fill="white"/>
            </svg>
            <span class="location-name" id="location-name">Locating…</span>
            <svg class="location-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="save-spot-btn" id="save-spot-btn" aria-label="Save this spot" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <polygon id="save-star-path" points="9,1.5 11,6.5 16.5,6.5 12.2,9.8 13.8,15 9,12 4.2,15 5.8,9.8 1.5,6.5 7,6.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
          </button>
        </header>

        <!-- Day selector -->
        <div class="day-selector-wrap">
          <div class="day-selector" id="day-selector" role="tablist" aria-label="Select forecast day">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- At-a-glance conditions -->
        <div class="conditions-bar" id="conditions-bar" aria-label="Current conditions">
          <div class="cond-item">
            <span class="cond-value" id="cond-wave">—</span>
            <span class="cond-label">waves</span>
          </div>
          <div class="cond-divider" aria-hidden="true"></div>
          <div class="cond-item">
            <span class="cond-value" id="cond-temp">—</span>
            <span class="cond-label">water</span>
          </div>
          <div class="cond-divider" aria-hidden="true"></div>
          <div class="cond-item">
            <span class="cond-value cond-wind-value">
              <svg class="wind-arrow" id="wind-arrow" width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <path d="M6.5 1.5v10M6.5 1.5L3.5 5M6.5 1.5L9.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span id="cond-wind">—</span>
            </span>
            <span class="cond-label" id="cond-wind-label">wind</span>
          </div>
        </div>

        <!-- Verdict cards -->
        <div class="verdict-stack" id="verdict-stack">
          <article class="verdict-card skeleton-loading" id="card-swimming" data-activity="swimming" role="button" tabindex="0" aria-expanded="false" aria-label="Swimming conditions">
            <div class="verdict-card-inner">
              <span class="activity-label">Swimming</span>
              <div class="verdict-row">
                <span class="verdict-word" id="swim-verdict">—</span>
                <span class="card-window" id="swim-window" hidden></span>
              </div>
              <p class="verdict-summary" id="swim-summary">Loading…</p>
            </div>
            <svg class="card-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </article>

          <article class="verdict-card skeleton-loading" id="card-freediving" data-activity="freediving" role="button" tabindex="0" aria-expanded="false" aria-label="Freediving conditions">
            <div class="verdict-card-inner">
              <span class="activity-label">Freediving</span>
              <div class="verdict-row">
                <span class="verdict-word" id="dive-verdict">—</span>
                <span class="card-window" id="dive-window" hidden></span>
              </div>
              <p class="verdict-summary" id="dive-summary">Loading…</p>
            </div>
            <svg class="card-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </article>
        </div>

        <!-- Hourly strip -->
        <section class="hourly-section">
          <h2 class="hourly-heading">Through the day</h2>
          <div class="hourly-strip-wrap">
            <div class="hourly-strip" id="hourly-strip" role="list" aria-label="Hourly conditions">
              <!-- Populated by JS -->
            </div>
          </div>
        </section>

        <p class="data-timestamp" id="data-timestamp" aria-live="polite"></p>

      </section>

      <!-- Tab 2: Map -->
      <section id="tab-map" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-map" hidden>

        <!-- Floating search bar -->
        <div class="map-search-wrap">
          <div class="map-search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="search" id="location-search" placeholder="Search location…" autocomplete="off" spellcheck="false" aria-label="Search for a location" aria-autocomplete="list" aria-controls="search-results">
            <button class="search-clear" id="search-clear" aria-label="Clear search" hidden>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <ul class="search-results" id="search-results" role="listbox" aria-label="Location suggestions" hidden></ul>
        </div>

        <!-- Map container -->
        <div id="map" aria-label="Interactive map — tap to select location"></div>

        <!-- GPS FAB -->
        <button class="gps-fab" id="gps-btn" aria-label="Use my current location">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="3" fill="currentColor"/>
            <circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10" y1="1" x2="10" y2="3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="10" y1="16.5" x2="10" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="1" y1="10" x2="3.5" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="16.5" y1="10" x2="19" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Location selection bottom sheet -->
        <div class="bottom-sheet" id="location-sheet">
          <div class="sheet-handle"></div>
          <div class="sheet-content">
            <p class="sheet-location-name" id="sheet-location-name">Tap the map to pick a spot</p>
            <div class="sheet-actions">
              <button class="btn-primary" id="btn-use-location" disabled>Use This Location</button>
              <button class="btn-secondary" id="btn-use-gps">Use My GPS Location</button>
            </div>
          </div>
        </div>

      </section>

      <!-- Tab 3: Saved -->
      <section id="tab-saved" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-saved" hidden>

        <header class="saved-header">
          <h1 class="saved-title">Saved Spots</h1>
        </header>

        <ul class="saved-list" id="saved-list" role="list" aria-label="Your saved spots">
          <!-- Populated by JS -->
        </ul>

        <div class="saved-empty" id="saved-empty" hidden>
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <polygon points="20,4 23.5,14 34,14 25.5,20.5 28.5,31 20,25 11.5,31 14.5,20.5 6,14 16.5,14" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.3"/>
          </svg>
          <p class="saved-empty-text">No saved spots yet</p>
          <p class="saved-empty-hint">Tap the star on any location to save it</p>
        </div>

      </section>

    </main>

    <!-- Bottom tab bar -->
    <nav class="tab-bar" role="tablist" aria-label="Main navigation">
      <button class="tab-btn active" id="tab-btn-conditions" role="tab" aria-selected="true" aria-controls="tab-conditions" data-tab="conditions">
        <svg class="tab-icon" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M1.5 13c2.5-4 5-4 7.5 0s5 4 7.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <path d="M1.5 8c2.5-4 5-4 7.5 0s5 4 7.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="tab-label">Today</span>
      </button>
      <button class="tab-btn" id="tab-btn-map" role="tab" aria-selected="false" aria-controls="tab-map" data-tab="map">
        <svg class="tab-icon" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <polygon points="1.5,4 8,1.5 14,5.5 20.5,3 20.5,18.5 14,21 8,17 1.5,19.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
          <line x1="8" y1="1.5" x2="8" y2="17" stroke="currentColor" stroke-width="1.5"/>
          <line x1="14" y1="5.5" x2="14" y2="21" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="tab-label">Map</span>
      </button>
      <button class="tab-btn" id="tab-btn-saved" role="tab" aria-selected="false" aria-controls="tab-saved" data-tab="saved">
        <svg class="tab-icon" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <polygon points="11,2 13.5,8.5 20.5,8.5 15,12.5 17,19 11,15 5,19 7,12.5 1.5,8.5 8.5,8.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        </svg>
        <span class="tab-label">Saved</span>
      </button>
    </nav>

    <!-- Detail sheet (slides up when verdict card tapped) -->
    <div class="detail-sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-label="Condition details" hidden>
      <div class="detail-backdrop" id="detail-backdrop"></div>
      <div class="detail-panel">
        <div class="sheet-handle"></div>
        <button class="detail-close" id="detail-close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="detail-activity activity-label" id="detail-activity">Swimming</span>
        <div class="detail-wave">
          <span class="detail-wave-num" id="detail-wave-num">0.0</span>
          <span class="detail-wave-unit">m</span>
        </div>
        <span class="detail-wave-label">significant wave height</span>
        <p class="detail-summary" id="detail-summary"></p>

        <!-- Why this verdict -->
        <ul class="factor-list" id="factor-list"></ul>

        <!-- Supporting facts -->
        <div class="detail-meta" id="detail-meta"></div>
        <a class="btn-cam" id="btn-cam" href="#" target="_blank" rel="noopener noreferrer" hidden>
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <rect x="1" y="3.5" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10 6.5l4-2v6l-4-2V6.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          Live Cam
        </a>
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
